
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>ОБРАДОВО — 2026</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #101010;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

button {
  font-family: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.app {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding:
    calc(env(safe-area-inset-top) + 12px)
    16px
    calc(env(safe-area-inset-bottom) + 15px);
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  min-height: 62px;
}

h1 {
  font-size: 19px;
  font-weight: 400;
  letter-spacing: .23em;
  margin: 0;
}

.subtitle {
  font-size: 10px;
  color: #aaa;
  letter-spacing: .16em;
  margin-top: 8px;
}

.counter {
  font-size: 14px;
  color: #ddd;
  white-space: nowrap;
}

.stage {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1300px;
  touch-action: pan-y;
  position: relative;
}

.book {
  position: relative;
  width: min(100%, calc((100dvh - 215px) * .706));
  max-height: 100%;
  aspect-ratio: 554 / 785;
  transform-style: preserve-3d;
  filter: drop-shadow(0 8px 20px #0008);
}

.sheet {
  position: absolute;
  inset: 0;
  transform-origin: left center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform-style: preserve-3d;
}

.sheet img {
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
  background: white;
}

.sheet.current {
  z-index: 3;
}

.sheet.below {
  z-index: 1;
}

.sheet.current::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    to right,
    transparent 35%,
    rgba(0,0,0,.25)
  );
  opacity: 0;
}

.sheet.turn-next {
  animation: flipout .72s
    cubic-bezier(.25,.55,.35,1) forwards;
}

.sheet.turn-next::after {
  animation: shadow .72s ease forwards;
}

.sheet.turn-prev {
  transform-origin: right center;
  animation: flipback .72s
    cubic-bezier(.25,.55,.35,1) forwards;
}

@keyframes flipout {
  0% {
    transform: rotateY(0deg);
    opacity: 1;
  }
  100% {
    transform: rotateY(-90deg);
    opacity: .4;
  }
}

@keyframes flipback {
  0% {
    transform: rotateY(0deg);
    opacity: 1;
  }
  100% {
    transform: rotateY(90deg);
    opacity: .4;
  }
}

@keyframes shadow {
  0% { opacity: 0; }
  50% { opacity: 1; }
  100% { opacity: 0; }
}

.hint {
  text-align: center;
  color: #999;
  font-size: 12px;
  letter-spacing: .08em;
  margin: 10px 0 16px;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 48px;
}

.controls button {
  background: #262626;
  border: 1px solid #555;
  color: white;
  border-radius: 25px;
  padding: 13px 16px;
  font-size: 14px;
}

.controls button:disabled {
  opacity: .3;
}

.controls .home {
  background: none;
  border: none;
  text-decoration: underline;
  color: #bbb;
  padding: 10px 3px;
  font-size: 12px;
}

@media (max-height: 610px) {
  header {
    min-height: 45px;
  }

  .hint {
    margin: 3px 0 6px;
  }

  .controls {
    min-height: 42px;
  }

  .controls button {
    padding: 10px 12px;
  }

  .book {
    width: min(
      100%,
      calc((100dvh - 160px) * .706)
    );
  }
}

@media (prefers-reduced-motion: reduce) {
  .sheet.turn-next,
  .sheet.turn-prev {
    animation-duration: .01s;
  }
}
</style>
</head>

<body>

<div class="app">

  <header>
    <div>
      <h1>ОБРАДОВО</h1>
      <div class="subtitle">
        ЖУРНАЛ · 2026
      </div>
    </div>

    <div class="counter" id="counter">
      1 / 24
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="book">

      <div class="sheet below">
        <img
          id="underImg"
          alt="Следующая страница"
        >
      </div>

      <div class="sheet current" id="over">
        <img
          id="overImg"
          alt="Страница журнала"
        >
      </div>

    </div>
  </main>

  <div class="hint">
    Листайте пальцем влево или вправо
  </div>

  <nav class="controls">
    <button id="prev">← Назад</button>
    <button class="home" id="first">
      В начало
    </button>
    <button id="next">Далее →</button>
  </nav>

</div>

<script>

// Страницы журнала.
// Все изображения лежат рядом с index.html.

const pages = Array.from(
  { length: 24 },
  (_, i) => "page-" +
    String(i + 1).padStart(2, "0") +
    ".jpg"
);

let index = 0;
let busy = false;

const over = document.getElementById("over");
const overImg = document.getElementById("overImg");
const underImg = document.getElementById("underImg");
const counter = document.getElementById("counter");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const first = document.getElementById("first");
const stage = document.getElementById("stage");

// Предварительная загрузка соседних страниц

function preload() {
  [index - 1, index + 1, index + 2]
    .filter(i => i >= 0 && i < pages.length)
    .forEach(i => {
      const image = new Image();
      image.src = pages[i];
    });
}

// Показываем текущую страницу

function draw() {
  over.className = "sheet current";

  overImg.src = pages[index];
  underImg.src = pages[index];

  counter.textContent =
    (index + 1) + " / " + pages.length;

  prev.disabled = index === 0;
  next.disabled = index === pages.length - 1;

  preload();
}

// Перелистывание

function flip(direction) {
  const newIndex = index + direction;

  if (
    busy ||
    newIndex < 0 ||
    newIndex >= pages.length
  ) {
    return;
  }

  busy = true;

  underImg.src = pages[newIndex];

  over.className = "sheet current";

  // Перезапуск анимации
  void over.offsetWidth;

  over.classList.add(
    direction > 0 ? "turn-next" : "turn-prev"
  );

  setTimeout(() => {
    index = newIndex;
    draw();
    busy = false;
  }, 730);
}

// Кнопки

next.addEventListener("click", () => {
  flip(1);
});

prev.addEventListener("click", () => {
  flip(-1);
});

first.addEventListener("click", () => {
  if (busy) return;

  index = 0;
  draw();
});

// Перелистывание пальцем

let startX = 0;
let startY = 0;

stage.addEventListener(
  "touchstart",
  event => {
    startX = event.touches[0].clientX;
    startY = event.touches[0].clientY;
  },
  { passive: true }
);

stage.addEventListener(
  "touchend",
  event => {
    const dx =
      event.changedTouches[0].clientX - startX;

    const dy =
      event.changedTouches[0].clientY - startY;

    if (
      Math.abs(dx) > 45 &&
      Math.abs(dx) > Math.abs(dy) * 1.2
    ) {
      flip(dx < 0 ? 1 : -1);
    }
  },
  { passive: true }
);

// Стрелки на клавиатуре

document.addEventListener("keydown", event => {
  if (event.key === "ArrowRight") flip(1);
  if (event.key === "ArrowLeft") flip(-1);
});

// Запуск

draw();

</script>

</body>
</html>
