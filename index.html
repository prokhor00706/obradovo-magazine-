
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>ОБРАДОВО — цифровой журнал</title>
<style>
:root {
  color-scheme: dark;
  font-family: Arial, Helvetica, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: #111;
  color: #fff;
}
header {
  position: fixed;
  z-index: 5;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: calc(env(safe-area-inset-top) + 16px) 20px 16px;
  background: linear-gradient(#111b, transparent);
  font-size: 12px;
  letter-spacing: .2em;
}
header a {
  color: white;
  text-decoration: none;
}
.hero {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 110px 22px 90px;
  position: relative;
  overflow: hidden;
}
.hero:before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(
    ellipse at 65% 35%,
    #405b67 0%,
    #172d36 32%,
    #10151c 65%,
    #0b0d10 100%
  );
  opacity: .9;
}
.hero:after {
  content: "";
  position: absolute;
  inset: -40%;
  background: linear-gradient(
    115deg,
    transparent 44%,
    #e45d5060 47%,
    #e6c26b60 49%,
    #72b58d60 51%,
    #6388c560 53%,
    transparent 56%
  );
  transform: rotate(-18deg);
  filter: blur(28px);
  opacity: .4;
  animation: glow 7s ease-in-out infinite alternate;
}
.hero > * {
  position: relative;
  z-index: 2;
}
.hero:before,
.hero:after {
  pointer-events: none;
}
.eyebrow {
  font-size: 12px;
  letter-spacing: .35em;
  opacity: .8;
  animation: rise 1.2s both;
}
.hero h1 {
  font-size: clamp(38px, 11vw, 90px);
  font-weight: 400;
  letter-spacing: .16em;
  margin: 18px 0;
  animation: rise 1.3s .2s both;
}
.hero p {
  font-size: 12px;
  letter-spacing: .22em;
  line-height: 1.9;
  animation: rise 1.3s .5s both;
}
.btn {
  position: relative;
  z-index: 3;
  cursor: pointer;
  touch-action: manipulation;
  margin-top: 35px;
  display: inline-block;
  border: 1px solid #fff9;
  border-radius: 100px;
  padding: 16px 24px;
  color: #fff;
  background: #ffffff12;
  text-decoration: none;
  font-size: 12px;
  letter-spacing: .16em;
  animation: rise 1.3s .7s both;
}
.section {
  padding: 90px 24px;
  min-height: 85svh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.section.light {
  background: #f6f5f1;
  color: #111;
}
.section h2 {
  font-weight: 400;
  font-size: clamp(40px, 15vw, 100px);
  margin: 0;
  line-height: 1;
}
.section .number {
  font-size: clamp(100px, 38vw, 280px);
  line-height: 1;
  font-weight: 300;
  letter-spacing: -.08em;
}
.section p {
  max-width: 340px;
  line-height: 1.6;
  font-size: 14px;
  letter-spacing: .13em;
}
.section small {
  letter-spacing: .25em;
  font-size: 12px;
}
.end { min-height: 45svh; }
footer {
  text-align: center;
  padding: 30px;
  color: #aaa;
  font-size: 11px;
  letter-spacing: .15em;
}
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes glow {
  to {
    opacity: .7;
    transform: rotate(-12deg) translateX(10%);
  }
}
@media (prefers-reduced-motion: reduce) {
  *, *:before, *:after {
    animation: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>

<header>
  <span>ОБРАДОВО / 2026</span>
  <a href="#numbers">ЛИСТАТЬ ↓</a>
</header>

<main>
  <section class="hero" id="top">
    <div class="eyebrow">ЦИФРОВОЙ ЖУРНАЛ</div>
    <h1>ОБРАДОВО</h1>
    <p>
      РАДУЙТЕСЬ · БУДЬТЕ РАДЫ<br>
      ВОЗРАДУЙТЕСЬ
    </p>
    <a class="btn" href="#numbers">
      ОТКРЫТЬ ЖУРНАЛ ↓
    </a>
  </section>

  <section class="section light" id="numbers">
    <div class="number">32</div>
    <small>ДНЯ</small>
    <p>32 дня, изменившие жизнь 61 человека</p>
  </section>

  <section class="section" id="people">
    <div class="number">61</div>
    <small>ЧЕЛОВЕК</small>
    <p>Истории людей, которых объединило Обрадово.</p>
  </section>

  <section class="section light end">
    <h2>ОБРАДОВО</h2>
    <p>Продолжение скоро</p>
    <a class="btn" style="color:#111;border-color:#111" href="#top">
      В НАЧАЛО ↑
    </a>
  </section>
</main>

<footer>
  ДЕМОНСТРАЦИОННАЯ ВЕРСИЯ · 2026
</footer>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
if (window.Telegram?.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

document.querySelectorAll('a[href^="#"]').forEach(function(link) {
  link.addEventListener('click', function(event) {
    var target = document.getElementById(
      link.getAttribute('href').slice(1)
    );

    if (!target) return;

    event.preventDefault();

    var reduced = window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;

    window.scrollTo({
      top: target.getBoundingClientRect().top + window.scrollY,
      behavior: reduced ? 'auto' : 'smooth'
    });
  });
});
</script>

</body>
</html>
